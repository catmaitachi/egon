spring.application.name=egon-api

# ---- Banco ----
# H2 em arquivo: roda sem instalar nada e os dados sobrevivem a reinícios.
# O arquivo fica em backend/data/ (ignorado pelo git). Para usar outro banco relacional,
# troque a URL e adicione o driver no pom.xml.
spring.datasource.url=jdbc:h2:file:./data/egon
spring.datasource.username=sa
spring.datasource.password=

# O schema é gerado a partir das entidades, que seguem docs/Sprint 2/Modelo de Dados.md.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Fuso da virada de semestre (HU05) e das datas de transações e trocas.
egon.fuso=America/Sao_Paulo

# ---- Login (HU01) ----
# Chave que assina o token de sessão. Em produção, defina EGON_TOKEN_SEGREDO.
egon.token.segredo=${EGON_TOKEN_SEGREDO:egon-dev-troque-este-segredo-em-producao}
egon.token.validade=12h

# ---- E-mail (HU07, HU10) ----
# Todo e-mail fica registrado como notificação, que o aluno e a empresa leem no painel.
# Com um servidor SMTP configurado, ele também é enviado de verdade:
# spring.mail.host=smtp.exemplo.com
# spring.mail.port=587
# spring.mail.username=usuario
# spring.mail.password=senha
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
egon.email.remetente=nao-responda@egon.app

# ---- Fotos das vantagens (HU08) ----
egon.fotos.pasta=./data/fotos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

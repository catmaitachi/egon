spring.application.name=egon-api

# ---- Banco ----
# H2 em arquivo: roda sem instalar nada e os dados sobrevivem a reinícios.
# O arquivo fica em backend/data/ (ignorado pelo git). Para usar outro banco relacional,
# troque a URL e adicione o driver no pom.xml.
# "egon2" porque as chaves viraram UUID e o ddl-auto=update não troca chave primária: o
# arquivo antigo (egon) fica intocado e o novo nasce com a carga inicial.
spring.datasource.url=jdbc:h2:file:./data/egon2
spring.datasource.username=sa
spring.datasource.password=

# O schema é gerado a partir das entidades, que seguem docs/Sprint 2/Modelo de Dados.md.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- JSON ----
# 1.5 num campo inteiro é recusado; o padrão do Jackson trunca para 1 e envia outra quantia sem avisar.
spring.jackson.deserialization.accept-float-as-int=false

# ---- Notificações ao vivo (WebSocket) ----
# Origens aceitas no handshake. Em dev o front chega pelo proxy do Vite, com a Origin dele.
egon.ws.origens=http://localhost:*,http://127.0.0.1:*

# ---- Admin inicial ----
# Criado na primeira subida, com login "admin". Em produção, defina EGON_ADMIN_SENHA.
egon.admin.senha=${EGON_ADMIN_SENHA:admin12345}

# ---- Fotos das vantagens (HU08) ----
# Pasta em disco, como prevê o modelo; fica em backend/data/ (ignorado pelo git).
egon.fotos.pasta=data/fotos
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ---- Modo dev ----
# Login sem senha em /dev (código Konami na tela de login), só para testar à mão. Desligado por padrão;
# liga com o perfil dev (application-dev.properties) ou EGON_DEV=true. Nunca em produção.
egon.dev=${EGON_DEV:false}

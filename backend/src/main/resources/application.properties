spring.application.name=egon-api

# ---- Banco ----
# H2 em arquivo: roda sem instalar nada e os dados sobrevivem a reinícios.
# O arquivo fica em backend/data/ (ignorado pelo git). Para usar outro banco relacional,
# troque a URL e adicione o driver no pom.xml.
spring.datasource.url=jdbc:h2:file:./data/egon
spring.datasource.username=sa
spring.datasource.password=

# O schema é gerado a partir das entidades, que seguem o diagrama relacional da Sprint 2.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

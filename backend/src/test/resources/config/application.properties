# Só o que muda nos testes. Fica em config/ para se somar ao application.properties principal,
# que tem precedência menor; com o mesmo caminho do principal, este arquivo o esconderia e os
# testes rodariam com uma configuração diferente da aplicação (open-in-view ligado, por exemplo).

# Banco em memória: cada execução dos testes começa do zero e não toca no arquivo de dev.
spring.datasource.url=jdbc:h2:mem:egon-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# Fotos de teste ficam dentro de target/, apagado pelo mvn clean.
egon.fotos.pasta=./target/test-fotos
